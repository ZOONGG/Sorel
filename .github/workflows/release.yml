name: Prepare manual release assets

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  build:
    name: Prepare manual release assets, test, and Velopack package
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Scan repository safety
        shell: pwsh
        env:
          SOREL_PRIVATE_PATTERNS: ${{ secrets.PRIVATE_NAME_PATTERNS }}
        run: ./tools/Test-RepositorySafety.ps1

      - name: Verify native bridge builds from source
        shell: pwsh
        run: ./tools/Build-NativeBridge.ps1 -OutputPath "runtime/bridge/Sorel.Native.dll"

      - name: Upload native bridge verification artifact
        uses: actions/upload-artifact@v7
        with:
          name: Sorel-Native-Bridge-${{ github.run_number }}
          path: runtime/bridge/Sorel.Native.dll
          if-no-files-found: error
          retention-days: 7
      - name: Restore locked dependencies
        run: dotnet restore Sorel.sln --locked-mode

      - name: Prepare manual release assets Release
        run: dotnet build Sorel.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test Sorel.sln -c Release --no-build --filter "Category!=PrivateAssets" --logger "trx;LogFileName=sorel.trx" --results-directory artifacts/test-results

      - name: Install pinned Velopack
        shell: pwsh
        run: dotnet tool install vpk --version 1.2.161 --tool-path artifacts/velopack-tools

      - name: Prepare manual release assets Setup and Portable artifacts
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Sorel/Sorel.csproj -Raw
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          ./tools/New-SorelRelease.ps1 `
            -Version $version `
            -OutputRoot "artifacts/release" `
            -Velopack -VpkPath artifacts/velopack-tools/vpk.exe `
            -SkipRestore `
            -SkipTests

      - name: Upload Windows distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Sorel-Windows-${{ github.run_number }}
          path: artifacts/release/velopack/*
          if-no-files-found: error
          retention-days: 14

      - name: Test isolated Velopack install and launch
        shell: pwsh
        run: ./tools/Test-SorelVelopackInstaller.ps1 -SetupPath artifacts/release/velopack/Sorel.App-stable-Setup.exe

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Sorel-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: error
          retention-days: 14
