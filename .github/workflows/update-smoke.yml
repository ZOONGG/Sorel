name: Sorel stable installed update smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build rebranded native bridge
        shell: pwsh
        run: ./tools/Build-NativeBridge.ps1 -OutputPath runtime/bridge/Sorel.Native.dll -WorkingRoot artifacts/native-working
      - name: Build and test isolated Sorel 1.0.0 to local-only 1.0.1
        shell: pwsh
        run: ./tools/New-SorelInstalledUpdateSmoke.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sorel-stable-update-evidence
          path: |
            artifacts/stable-update-smoke/**/*.txt
            artifacts/stable-update-smoke/**/*.json
            artifacts/stable-update-smoke/**/*.png
            artifacts/stable-update-smoke/**/*.log
          if-no-files-found: warn